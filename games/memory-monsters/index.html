<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#473d81"/><meta name="description" content="記憶怪獸翻翻樂：給學齡前孩子的圖像與語音配對遊戲。"/><link rel="icon" href="./favicon.svg"/><title>記憶怪獸翻翻樂｜Game Lab</title></head>
<body><div id="app">
  <header class="topbar"><a class="brand" href="/" aria-label="Game Lab"><span class="brand-mark">M</span><span>GAME LAB <b id="brand-title"></b></span></a><div class="top-actions"><label class="sr-only" for="language-select">Language</label><select id="language-select" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="es">Español</option><option value="pt-BR">Português (BR)</option><option value="fr">Français</option><option value="ar">العربية</option><option value="sw">Kiswahili</option><option value="id">Bahasa Indonesia</option><option value="hi">हिन्दी</option></select><button id="sound-button" class="sound-button" type="button">Sound</button></div></header>
  <main class="shell"><section class="hero"><div><p class="eyebrow">C002 · MEMORY MONSTERS</p><h1 id="title"></h1><p id="subtitle"></p></div><div class="hero-monsters" aria-hidden="true"><i class="mini m1"></i><i class="mini m2"></i><i class="mini m3"></i></div></section>
    <section id="setup" class="panel setup"><div class="speech"><span class="speaker" aria-hidden="true">♪</span><p id="intro"></p></div><fieldset><legend id="level-label"></legend><div class="levels"><label><input type="radio" name="level" value="3" checked/><span><b>3</b><small id="level-small"></small></span></label><label><input type="radio" name="level" value="6"/><span><b>6</b><small id="level-medium"></small></span></label><label><input type="radio" name="level" value="8"/><span><b>8</b><small id="level-big"></small></span></label></div></fieldset><button id="start-button" class="primary" type="button"></button></section>
    <section id="play" class="play hidden"><div class="hud"><div><span id="pairs-label"></span><strong id="pairs">0 / 3</strong></div><div id="voice-bubble" class="voice-bubble" role="status" aria-live="polite"></div><div><span id="turns-label"></span><strong id="turns">0</strong></div></div><div id="board" class="board" role="grid"></div></section>
    <section id="result" class="panel result hidden" role="status"><div class="party" aria-hidden="true"><i class="mini m1"></i><i class="mini m2"></i><i class="mini m3"></i></div><h2 id="result-title"></h2><p id="result-copy"></p><div class="actions"><button id="replay-button" class="primary" type="button"></button><button id="share-button" class="secondary" type="button"></button><button id="copy-button" class="secondary" type="button"></button></div><p id="share-status" aria-live="polite"></p></section>
  </main><footer>Game Lab · C002 · 無廣告 · 不需帳號 · 可離線遊玩</footer>
</div><script type="module" src="/src/main.ts"></script></body></html>
