<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#112f39" />
    <meta name="description" content="不計時的顏色分類解謎。倒水、撤銷、提示，挑戰30個可解關卡。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>顏色實驗室｜Game Lab</title>
  <link rel="canonical" href="https://games.somewhen.life/play/color-lab/"><meta property="og:type" content="website"><meta property="og:title" content="顏色實驗室｜Game Lab"><meta property="og:description" content="倒轉試管，讓相同顏色住在一起。"><meta property="og:image" content="https://games.somewhen.life/play/color-lab/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://games.somewhen.life/play/color-lab/og.png"></head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">✳</span><span>GAME LAB <b id="brand-title">/ 顏色實驗室</b></span></div>
        <div class="top-actions"><label class="visually-hidden" for="language-select">Language</label><select id="language-select" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="es">Español</option><option value="pt-BR">Português (BR)</option><option value="fr">Français</option><option value="ar">العربية</option><option value="sw">Kiswahili</option><option value="id">Bahasa Indonesia</option><option value="hi">हिन्दी</option></select><button id="sound-button" type="button">🔊</button></div>
      </header>
      <main class="game-shell">
        <div class="headline"><div><span class="eyebrow">G003 · COLOR LAB</span><h1 id="title">顏色實驗室</h1><p id="tagline">讓顏色找到自己的家</p></div><div class="mascot" aria-hidden="true"><div class="mascot-eyes"><i></i><i></i></div><span>✦</span></div></div>
        <div class="hud"><div><small id="level-label">關卡</small><strong id="level-value">01 <em>/30</em></strong></div><div><small id="moves-label">步數</small><strong id="moves-value">0</strong></div><div><small id="goal-label">最少</small><strong id="goal-value">3</strong></div><div><small id="best-label">最佳</small><strong id="best-value">—</strong></div></div>
        <section class="lab" aria-label="顏色實驗室遊戲">
          <svg class="herbarium-art" viewBox="0 0 600 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#8ca580" stroke-width="2" opacity=".5"><path d="M28 324Q60 232 32 128M35 186Q1 156 22 145Q45 146 35 186M40 225Q78 185 82 204Q77 226 40 225M33 269Q-1 237 17 230Q36 235 33 269M555 321Q527 233 559 138M548 200Q578 166 580 184Q579 201 548 200M545 247Q510 213 509 231Q515 248 545 247"/></g><g transform="translate(395 76) rotate(8)"><rect width="142" height="96" rx="3" fill="#e7e8cf" stroke="#bcc7aa"/><path d="M14 15H123M14 28H92" stroke="#bcc7aa"/><circle cx="31" cy="57" r="12" fill="#ce8d70"/><path d="M71 44L85 70H57Z" fill="#d9bc5d"/><path d="M111 44L124 57L111 70L98 57Z" fill="#89a7bf"/></g><g fill="#c7b67f" opacity=".5"><circle cx="109" cy="350" r="4"/><circle cx="129" cy="362" r="2"/><circle cx="479" cy="343" r="3"/></g><path d="M84 375Q300 387 520 375" fill="none" stroke="#c4bca3" stroke-dasharray="5 7"/></svg>
          <div class="lab-ornament bubble-one"></div><div class="lab-ornament bubble-two"></div><div class="lab-ornament bubble-three"></div>
          <div class="lab-top"><span class="lab-kicker">✳ &nbsp; COLOR SORT</span><div class="lab-top-actions"><button id="daily-button" class="level-button daily-button" type="button">☀ 今日題目</button><button id="level-button" class="level-button" type="button">☷ <span id="select-label">選擇關卡</span></button></div></div>
          <p id="daily-banner" class="daily-banner hidden"></p>
          <div class="tubes" id="tubes" role="group" aria-label="五支試管"></div>
          <div class="lab-floor" aria-hidden="true"></div>
          <div class="feedback-line"><span class="feedback-icon" aria-hidden="true">✦</span><p id="feedback" role="status" aria-live="polite">先選一支試管</p></div>
          <div class="tools"><button id="undo-button" type="button">↶ <span id="undo-label">撤銷</span></button><button id="hint-button" type="button">✧ <span id="hint-label">給我提示</span></button><button id="restart-button" type="button">↻ <span id="restart-label">重來</span></button></div>
          <button id="pause-button" class="pause-button" type="button">Ⅱ <span id="pause-label">休息一下</span></button>
          <div id="ready-panel" class="overlay"><div class="overlay-card"><div class="overlay-art" aria-hidden="true"><span>✳</span><i></i><i></i><i></i></div><span class="pill" id="ready-level">關卡01 / 30</span><h2 id="ready-title">讓顏色找到自己的家</h2><p id="challenge-intro" class="challenge-intro hidden"></p><p id="ready-description">先點一支試管，再點要倒入的試管。把同色裝滿一管就成功！沒有倒數，慢慢試也可以。</p><div class="ready-extras"><button id="ready-daily-button" class="secondary-button" type="button">☀ 今日題目</button><button id="watch-button" class="secondary-button hidden" type="button">看朋友的解法</button></div><button id="start-button" class="primary-button" type="button">開始實驗 →</button></div></div>
          <div id="pause-panel" class="overlay hidden"><div class="overlay-card"><span class="pill">✳ COLOR LAB</span><h2 id="pause-title">休息一下</h2><button id="resume-button" class="primary-button" type="button">繼續實驗</button></div></div>
          <div id="level-panel" class="overlay hidden"><div class="overlay-card level-card"><h2 id="level-select-title">選擇關卡</h2><div id="level-grid" class="level-grid"></div><p id="level-message" role="status"></p><button id="level-close" class="secondary-button" type="button">✕</button></div></div>
          <div id="result-panel" class="overlay hidden"><div class="overlay-card result-card"><div class="result-burst" aria-hidden="true">✦ ✳ ✦</div><span class="pill" id="result-level">關卡01</span><h2 id="result-title">顏色都回家了！</h2><div id="result-stars" class="result-stars" aria-label="三星">★★★</div><p id="result-description"></p><div class="share-preview" aria-hidden="true"><span>GAME LAB / COLOR LAB</span><strong id="share-preview-number">3</strong><span id="share-preview-copy">第1關 · 3步</span></div><button id="share-button" class="primary-button" type="button">分享成績，挑戰朋友</button><div class="share-actions"><button id="download-button" type="button">下載圖卡</button><button id="copy-button" type="button">複製挑戰連結</button></div><p id="share-status" role="status" aria-live="polite"></p><div class="result-actions"><button id="replay-button" type="button">再試一次</button><button id="next-button" type="button">下一個實驗 →</button></div></div></div>
        </section>
        <p class="keyboard-hint">點一支試管，再點另一支倒水</p>
      </main>
      <footer id="footer">30關可離線遊玩 · 進度只留在這台裝置</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
