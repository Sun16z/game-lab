<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d8eaf0"><title>雲朵捏捏樂｜Game Lab</title></head><body>
<header class="topbar"><a href="/" class="brand">☁ GAME LAB</a><div class="top-actions"><label class="sr-only" for="language">Language</label><select id="language" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="es">Español</option><option value="pt-BR">Português (BR)</option><option value="fr">Français</option><option value="ar">العربية</option><option value="sw">Kiswahili</option><option value="id">Bahasa Indonesia</option><option value="hi">हिन्दी</option></select><button id="sound" type="button">🔊</button></div></header>
<main class="shell"><section id="setup" class="welcome paper"><div class="hero-cloud" aria-hidden="true">☁<i>✦</i></div><p class="eyebrow">G018 · CLOUD STUDIO</p><h1 id="title"></h1><p id="intro"></p><p class="learning" id="learning"></p><button id="start" class="primary" type="button"></button></section>
<section id="play" class="hidden"><div class="stage-head"><div><p class="eyebrow">CLOUD STUDIO · 01</p><h1 id="play-title"></h1></div><p id="hint"></p></div><div id="board" class="board"><div class="sun" aria-hidden="true"></div><i class="bird bird-one" aria-hidden="true">⌁</i><i class="bird bird-two" aria-hidden="true">⌁</i><svg id="cloud" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><path id="cloud-shadow"></path><path id="cloud-shape"></path></svg><div id="handles" class="handles"></div><div id="stickers" class="stickers"></div></div><p id="help" class="help"></p><div class="toolbar"><div class="sticker-tools"><button type="button" data-sticker="star"><span>✦</span><b id="star"></b></button><button type="button" data-sticker="rain"><span>💧</span><b id="rain"></b></button><button type="button" data-sticker="rainbow"><span>🌈</span><b id="rainbow"></b></button></div><div class="actions"><button id="undo" type="button"></button><button id="clear" type="button"></button><button id="finish" class="primary" type="button"></button></div></div></section>
<section id="result" class="paper result hidden" aria-live="polite"><p class="eyebrow">YOUR LITTLE SKY · ✦</p><h2 id="result-title"></h2><div id="result-art" class="result-art"></div><div class="actions"><button id="again" class="primary" type="button"></button><button id="share" type="button"></button><button id="copy" type="button"></button></div><p id="share-status" role="status"></p></section></main><script type="module" src="/src/main.ts"></script></body></html>
