<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#173b52"/><meta name="description" content="算術跑酷王：換到正確答案跑道，帶著小怪獸穿越果凍城市。"/><link rel="icon" href="./favicon.svg"/><title>算術跑酷王｜Game Lab</title><link rel="canonical" href="https://games.somewhen.life/play/math-runner/"><meta property="og:type" content="website"><meta property="og:title" content="算術跑酷王｜Game Lab"><meta property="og:description" content="衝向正確答案的跑道，躲過障礙。"><meta property="og:image" content="https://games.somewhen.life/play/math-runner/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://games.somewhen.life/play/math-runner/og.png"></head>
<body>
  <div id="loading" class="loading" role="status"><span></span><p>Game Lab</p></div>
  <div id="app" class="hidden">
    <header class="topbar"><a class="brand" href="/" aria-label="Game Lab"><span class="brand-mark">R</span><span>GAME LAB <b id="brand-title"></b></span></a><div class="top-actions"><label class="sr-only" for="language-select">Language</label><select id="language-select" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="es">Español</option><option value="pt-BR">Português (BR)</option><option value="fr">Français</option><option value="ar">العربية</option><option value="sw">Kiswahili</option><option value="id">Bahasa Indonesia</option><option value="hi">हिन्दी</option></select><button id="sound-button" class="sound-button" type="button">Sound</button></div></header>
    <main class="shell">
      <section class="hero"><div><p class="eyebrow">G004 · ARITHMETIC RUNNER</p><h1 id="title"></h1><p id="subtitle"></p></div><div class="hero-art" aria-hidden="true"><i class="sun"></i><i class="road-mini"><b></b></i><div class="runner-friends" aria-hidden="true"><img src="./friends/dodo.webp" alt=""><img src="./friends/lili.webp" alt=""><img src="./friends/pip.webp" alt=""></div></div></section>
      <section id="setup" class="setup-panel"><div class="intro-row"><span class="route-icon" aria-hidden="true"><i></i><i></i><i></i></span><p id="intro"></p></div><p id="challenge-banner" class="challenge-banner hidden"></p>
        <div class="setup-grid"><fieldset><legend id="subject-label"></legend><div class="modes"><label><input type="radio" name="subject" value="math" checked/><span><b id="math-title"></b><small id="math-copy"></small></span></label><label><input type="radio" name="subject" value="english"/><span><b id="english-title"></b><small id="english-copy"></small></span></label></div></fieldset>
        <fieldset><legend id="grade-label"></legend><div class="modes"><label><input type="radio" name="grade" value="middle" checked/><span><b id="middle-title"></b><small id="middle-copy"></small></span></label><label><input type="radio" name="grade" value="upper"/><span><b id="upper-title"></b><small id="upper-copy"></small></span></label></div></fieldset></div><button id="start-button" class="primary" type="button"></button></section>
      <section id="play" class="play hidden">
        <div class="hud"><div><span id="score-label"></span><strong id="score">0</strong></div><div><span id="streak-label"></span><strong id="streak">0</strong></div><div><span id="shield-label"></span><strong id="shields" class="shield-pips" aria-label="3">●●●</strong></div><div><span id="time-label"></span><strong id="time">90</strong></div><button id="pause-button" class="pause-button" type="button"></button></div>
        <div id="stage" class="runner-stage" tabindex="0" aria-label="跑酷遊戲區">
          <canvas id="world" class="world-canvas" aria-hidden="true"></canvas><div class="runner-friends" aria-hidden="true"><img src="./friends/dodo.webp" alt=""><img src="./friends/lili.webp" alt=""><img src="./friends/pip.webp" alt=""></div>
          <div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="city-block b1"></i><i class="city-block b2"></i><i class="city-block b3"></i><i class="city-block b4"></i></div>
          <div class="city-festival" aria-hidden="true"><i class="balloon"></i><i class="pennants"></i><i class="kiosk kiosk-left"><b>★</b></i><i class="kiosk kiosk-right"><b>♪</b></i><i class="spectator spectator-left"></i><i class="spectator spectator-right"></i></div>
          <svg class="road-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M36 42L64 42L100 100H0Z" fill="#31586a"/><path d="M36 42L0 100M64 42L100 100" stroke="#f4cb69" stroke-width="1.4"/><path class="road-dashes" d="M45.33 42L33.78 100M54.67 42L66.22 100" stroke="#fff4cf" stroke-width=".65" stroke-dasharray="4 5"/><path d="M34 94H66" stroke="#8dd8bf" stroke-width=".6" opacity=".35"/></svg>
          <div id="runner-shadow" class="runner-shadow" aria-hidden="true"></div>
          <div id="question" class="question-pill" role="status" aria-live="polite"></div>
          <div id="gate" class="answer-gate" aria-hidden="true"><span></span><span></span><span></span></div>
          <div id="obstacle" class="obstacle hurdle lane-1" aria-hidden="true"><i></i><i></i><b></b></div>
          <div id="runner" class="runner lane-1" aria-hidden="true"><i class="ear left"></i><i class="ear right"></i><b class="face"><i></i><i></i><em></em></b><i class="foot left"></i><i class="foot right"></i></div>
          <div class="speed-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
          <div id="pause-overlay" class="pause-overlay hidden"><strong id="pause-title"></strong><button id="resume-button" class="primary" type="button"></button></div>
        </div>
        <div class="run-controls"><div class="lane-controls" role="group" aria-label="選擇跑道"><button data-lane="0" type="button"><span>1</span><b id="lane-left"></b></button><button data-lane="1" type="button" class="active"><span>2</span><b id="lane-center"></b></button><button data-lane="2" type="button"><span>3</span><b id="lane-right"></b></button></div><div class="action-controls"><button id="jump-button" type="button"><span aria-hidden="true">↑</span><b id="jump-label"></b></button><button id="boost-button" type="button"><span aria-hidden="true">»</span><b id="boost-label"></b><small id="boost-count">×2</small></button></div></div>
      </section>
      <section id="result" class="result-panel hidden" role="status"><div class="finish-art" aria-hidden="true"><i></i><i></i><i></i></div><p class="eyebrow">FINISH</p><h2 id="result-title"></h2><strong id="result-score"></strong><p id="result-copy"></p><p id="best-copy"></p><div class="actions"><button id="replay-button" class="primary" type="button"></button><button id="share-button" class="secondary" type="button"></button><button id="copy-button" class="secondary" type="button"></button></div><p id="share-status" aria-live="polite"></p></section>
      <section id="error" class="error-panel hidden" role="alert"><h2>Game paused</h2><p id="error-copy"></p><a href="/">Game Lab</a></section>
    </main><footer>Game Lab · G004 · <a href="https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=998">Mozart K.545 · MIDI: Alejandro Sierra / Mutopia</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/">CC BY-SA 3.0</a> · Game Lab adaptation</footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body></html>
