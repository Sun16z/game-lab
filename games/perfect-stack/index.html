<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#182d3a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="抓準時機放下方塊，挑戰你的最高層數。免費遊玩完美疊塔。" />
    <title>完美疊塔｜Game Lab</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">▦</span><span>GAME LAB <b id="brand-title">/ 完美疊塔</b></span></div>
        <div class="top-actions"><label class="visually-hidden" for="language-select">Language</label><select id="language-select" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="es">Español</option><option value="pt-BR">Português (BR)</option><option value="fr">Français</option><option value="ar">العربية</option><option value="sw">Kiswahili</option><option value="id">Bahasa Indonesia</option><option value="hi">हिन्दी</option></select><button id="sound-button" class="icon-button" type="button" aria-pressed="false">音效：關</button></div>
      </header>
      <main class="game-wrap">
        <div class="hud" aria-live="polite">
          <div><small id="layers-label">層數</small><strong id="layers">0</strong></div>
          <div class="score"><small id="score-label">分數</small><strong id="score">0</strong></div>
          <div><small id="best-label">最佳</small><strong id="best">0</strong></div>
        </div>
        <div class="stage-frame">
          <div id="game-canvas" aria-label="完美疊塔遊戲畫面"></div>
          <div id="combo-chip" class="game-chip combo-chip hidden"></div>
          <div id="record-chip" class="game-chip record-chip hidden" role="status" aria-live="polite"></div>
          <div id="ready-panel" class="overlay">
            <div class="overlay-card">
              <span class="pill" id="ready-pill">一鍵挑戰</span>
              <h1 id="ready-title">抓準時機，<br />疊得更高。</h1>
              <p id="ready-description">方塊左右移動時，點一下畫面就能放下。對得越準，塔就越穩。</p>
              <div class="mode-picker"><label id="mode-label" for="mode-select">模式</label><select id="mode-select"><option value="standard">一般</option><option value="child">兒童</option></select></div>
              <div class="theme-picker"><label id="ready-theme-label" for="ready-theme-select">主題</label><select id="ready-theme-select"><option value="classic">經典</option><option value="neon">霓虹</option><option value="cosmos">星際</option></select><small id="ready-total">累積0層</small></div>
              <button id="start-button" class="primary-button" type="button"><span id="start-label">開始遊戲</span> <span aria-hidden="true">→</span></button>
            </div>
          </div>
          <div id="pause-panel" class="overlay hidden">
            <div class="overlay-card compact"><span class="pill" id="pause-pill">暫停中</span><h2 id="pause-title">喘口氣，再繼續。</h2><button id="resume-button" class="primary-button" type="button">繼續遊戲</button></div>
          </div>
          <div id="result-panel" class="overlay hidden">
            <div class="overlay-card compact">
              <span class="pill" id="result-pill">本局結束</span>
              <h2 id="result-title">疊得漂亮！</h2>
              <div class="result-number"><strong id="result-layers">0</strong><span id="result-unit">層</span></div>
              <p id="result-summary"></p>
              <p id="result-achievements" class="milestone-note hidden"></p>
              <p id="result-unlocked" class="milestone-note hidden"></p>
              <div id="share-preview" class="share-preview" aria-hidden="true"><span class="share-preview-brand">GAME LAB</span><span id="share-preview-score" class="share-preview-score">0</span><span id="share-preview-invitation">我疊到0層，你能超過嗎？</span></div>
              <div class="theme-picker result-theme"><label id="result-theme-label" for="result-theme-select">主題</label><select id="result-theme-select"><option value="classic">經典</option><option value="neon">霓虹</option><option value="cosmos">星際</option></select><small id="result-total">累積0層</small></div>
              <button id="share-card-button" class="primary-button share-main-button" type="button">分享成績，挑戰朋友</button>
              <div class="share-actions"><button id="download-card-button" type="button">下載圖卡</button><button id="copy-link-button" type="button">複製連結</button></div>
              <p id="share-status" class="share-status" role="status" aria-live="polite"></p>
              <button id="retry-button" class="retry-button" type="button"><span id="retry-label">再玩一次</span> <span aria-hidden="true">↻</span></button>
            </div>
          </div>
          <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
        </div>
        <div class="below"><p id="hint">點一下遊戲畫面，放下方塊</p><button id="pause-button" class="text-button hidden" type="button">暫停</button></div>
      </main>
      <footer id="footer-text">獨立HTML5遊戲 · 成績只保存在這台裝置 · 首次載入後可離線遊玩</footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
