<style>
/* Plan: sky, not paper. Tiles are floating islands; chips are hanging wind-chime tags. One bold idea (the islands), everything else quiet. */
:root{
  --sky:#9ED8F7; --mist:#E8F6FF; --lagoon:#16406B; --gold:#FFC83D; --grass:#5DBB63;
  --soil:#B98C63; --cloud:#FDFEFF; --shadow:22 64 107;
  --text:var(--lagoon); --surface:var(--cloud); --tag:var(--cloud);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#0F2547;--mist:#1B3A66;--text:#F1F7FF;--surface:#22477A;--tag:#22477A;--soil:#6E5A4B;--shadow:4 12 30;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#0F2547;--mist:#1B3A66;--text:#F1F7FF;--surface:#22477A;--tag:#22477A;--soil:#6E5A4B;--shadow:4 12 30;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--sky)}
body{margin:0;min-height:100dvh;font-family:"Chiron GoRound TC","PingFang TC","Noto Sans TC",system-ui,sans-serif;font-weight:500;color:var(--text);
  background:linear-gradient(180deg,var(--sky) 0,var(--mist) 70%) fixed;-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 34%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 33% 41%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 22%,#fff8 50%,transparent 51%)}}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
.wrap{width:min(100% - 2rem,1080px);margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem;text-decoration:none}
.brand i{font-size:1.6rem;color:var(--gold);filter:drop-shadow(0 1px 0 rgb(var(--shadow)/.4))}
.grown{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 1rem;border-radius:999px;background:var(--surface);text-decoration:none;font-weight:800;font-size:.95rem;box-shadow:0 2px 0 rgb(var(--shadow)/.18)}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem;padding:.5rem 0 1rem}
.hero h1{margin:0;font-weight:800;font-size:clamp(1.75rem,7vw,2.6rem);line-height:1.25;letter-spacing:.02em}
.hero img{width:clamp(78px,22vw,120px);height:auto;flex:none;filter:drop-shadow(0 8px 6px rgb(var(--shadow)/.18))}
.continue{display:flex;align-items:center;gap:.85rem;padding:.7rem 1rem .7rem .7rem;margin-bottom:1.1rem;border-radius:22px;background:var(--gold);color:#16406B;text-decoration:none;box-shadow:0 4px 0 #D9A21E}
.continue .play{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#16406B;color:var(--gold);font-size:1.5rem;flex:none}
.continue small{display:block;font-size:.9rem}
.continue strong{font-size:1.2rem;font-weight:800}
.continue[hidden]{display:none}
.continue:active{transform:translateY(3px);box-shadow:0 1px 0 #D9A21E}
/* chime tags */
.tags{position:sticky;top:0;z-index:2;display:flex;gap:.6rem;overflow-x:auto;margin:0 -1rem;padding:1.1rem 1rem .6rem;scrollbar-width:none;
  background:linear-gradient(var(--sky) 70%,transparent)}
.tags::-webkit-scrollbar{display:none}
.tag{position:relative;flex:none;display:grid;justify-items:center;gap:.15rem;width:76px;padding:.55rem 0 .5rem;border:0;border-radius:10px 10px 18px 18px;background:var(--tag);color:var(--text);font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 3px 0 rgb(var(--shadow)/.2);transform-origin:50% -14px}
.tag::before{content:"";position:absolute;top:-14px;left:50%;width:2px;height:14px;background:rgb(var(--shadow)/.35)}
.tag i{font-size:1.7rem}
.tag[aria-pressed="true"]{background:var(--gold);color:#16406B;box-shadow:0 3px 0 #D9A21E}
@media (prefers-reduced-motion:no-preference){.tag[aria-pressed="true"]{animation:chime .5s ease-out}}
@keyframes chime{30%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
/* islands */
.isles{list-style:none;margin:0;padding:.4rem 0 2rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6rem 1rem}
.isle{position:relative;min-width:0}
.isle[hidden]{display:none}
.isle a.go{display:grid;justify-items:center;gap:.55rem;text-decoration:none;transition:transform .15s}
.land{position:relative;width:100%;aspect-ratio:1/0.92;filter:drop-shadow(0 14px 10px rgb(var(--shadow)/.22))}
.top{position:absolute;inset:0 3% 21% 3%;overflow:hidden;background:var(--cloud);border-radius:var(--blob)}
.top svg{width:100%;height:100%}
.top img{position:absolute;right:2%;bottom:-2%;width:44%;height:auto}
.top img.pip{width:36%}
.ledge{position:absolute;left:0;right:0;bottom:13%;height:10%;border-radius:999px;background:var(--grass);box-shadow:inset 0 -4px 0 rgb(0 0 0 / .08)}
.rock{position:absolute;left:14%;right:14%;bottom:0;height:16%;background:var(--soil);clip-path:polygon(0 0,100% 0,62% 100%,38% 100%)}
.isle:nth-child(3n+1){--blob:34% 40% 14% 14% / 30% 34% 10% 10%}
.isle:nth-child(3n+2){--blob:42% 30% 14% 14% / 36% 28% 10% 10%}
.isle:nth-child(3n){--blob:30% 44% 14% 14% / 26% 38% 10% 10%}
.name{font-weight:800;font-size:1.1rem;line-height:1.3;text-align:center}
.isle a.go:active{transform:translateY(5px)}
.isle a.go:active .land{filter:drop-shadow(0 6px 5px rgb(var(--shadow)/.22))}
.info{position:absolute;top:2%;left:2%;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--text);text-decoration:none;font-size:1.2rem;box-shadow:0 2px 0 rgb(var(--shadow)/.18)}
footer{padding:1.5rem 0 2.5rem;font-size:.9rem;opacity:.85}
footer a{font-weight:800}
@media (min-width:720px){.isles{grid-template-columns:repeat(3,minmax(0,1fr));gap:2.2rem 1.6rem}.tags{margin-inline:0;padding-inline:0}.tag{width:88px}}
@media (min-width:1020px){.isles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.isle a.go{transition:none}.isle a.go:active,.continue:active{transform:none}}
</style>
</head>

const tags=document.getElementById("tags"), isles=document.getElementById("isles");
isles.innerHTML=games.map(g=>`<li class="isle" data-category="${g.category}"><a class="go" href="/play/${g.slug}/" data-slug="${g.slug}"><span class="land"><span class="ledge"></span><span class="rock"></span><span class="top">${g.svg}<img class="${g.friend}" src="/brand/${g.friend}.webp" alt="" loading="lazy"></span></span><span class="name">${g.title}</span></a><a class="info" href="/games/${g.slug}/" aria-label="${g.title}的玩法介紹"><i class="ph-bold ph-info"></i></a></li>`).join("");
function setFilter(id){tags.querySelectorAll(".tag").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===id)));isles.querySelectorAll(".isle").forEach(li=>li.hidden=!(id==="all"||li.dataset.category===id));}
tags.innerHTML=filters.map(([id,label,icon])=>`<button type="button" class="tag" data-id="${id}" aria-pressed="false"><i class="ph-fill ph-${icon}"></i>${label}</button>`).join("");
tags.addEventListener("click",e=>{const b=e.target.closest(".tag");if(b)setFilter(b.dataset.id)});
setFilter("all");
const key="game-lab:portal:last-played";
isles.addEventListener("click",e=>{const a=e.target.closest("a.go");if(a)try{localStorage.setItem(key,a.dataset.slug)}catch{}});
try{const s=localStorage.getItem(key),g=games.find(x=>x.slug===s);if(g){const c=document.getElementById("continue");c.hidden=false;c.href=`/play/${g.slug}/`;document.getElementById("continue-title").textContent=g.title}}catch{}
